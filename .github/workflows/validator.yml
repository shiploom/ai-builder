name: validator

on:
  push:
    paths:
      - "validators/**"
      - "schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/**"
      - "site/**"
      - ".github/workflows/validator.yml"
  pull_request:
    paths:
      - "validators/**"
      - "schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/**"
      - "site/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras for pytest only; validator itself is stdlib-only)
        run: pip install -e ".[dev]"
      - name: Hermetic unit tests (no network)
        run: pytest tests/unit -q
      - name: Strict validate on repo (offline, stdlib only)
        run: python validators/validate.py --strict .
      - name: Trace index builds with zero dangling links
        run: python validators/trace.py --strict . --out /tmp/trace.json
      - name: Installed entry point smoke (init/validate/status/doctor/audit)
        run: |
          shiploom doctor
          rm -rf /tmp/ship-smoke && mkdir -p /tmp/ship-smoke && cd /tmp/ship-smoke
          shiploom init --green --harness auto
          shiploom validate --strict .
          shiploom status
          shiploom audit
      - name: AC demo (AC1-AC6, ~90s; node leg skips if unavailable)
        run: SHIP_PY="$(command -v python)" sh scripts/ac-demo.sh
      - name: Harness conformance (deterministic, no LLM calls)
        run: shiploom conformance --harness all

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Docs sync check + self-test + static build
        working-directory: site
        run: |
          node scripts/sync-docs.mjs --self-test
          node scripts/sync-docs.mjs --check
          npm ci --no-audit --no-fund
          npm run build
