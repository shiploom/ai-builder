name: validator

on:
  push:
    paths:
      - "schemas/**"
      - "tests/**"
      - "docs/**"
      - "site/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "scripts/build-go.sh"
      - "scripts/ac-demo.sh"
      - "scripts/collect-dashboard.sh"
      - "scripts/version-check.sh"
      - ".github/workflows/validator.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "tests/**"
      - "docs/**"
      - "site/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "scripts/build-go.sh"
      - "scripts/ac-demo.sh"
      - "scripts/collect-dashboard.sh"
      - "scripts/version-check.sh"

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false
      # Operator tooling only (auto-detected test gates shell out to the
      # ambient pytest, like node for the node leg); the CLI under test
      # is the Go binary.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pytest operator shim
        run: pip install pytest
      - name: Format, vet, unit test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./cmd/... ./internal/...
          go test ./cmd/... ./internal/...
      - name: Build CLI
        run: sh scripts/build-go.sh /tmp/shiploom-go
      - name: Strict validate on repo (offline, stdlib only)
        run: SHIPLOOM_SCHEMAS="$PWD/schemas" /tmp/shiploom-go validate --strict .
      - name: Installed entry point smoke (init/validate/status/doctor/audit)
        run: |
          export PATH="/tmp:$PATH" && cp /tmp/shiploom-go /tmp/shiploom
          SHIPLOOM_SCHEMAS="$PWD/schemas" shiploom doctor
          rm -rf /tmp/ship-smoke && mkdir -p /tmp/ship-smoke && cd /tmp/ship-smoke
          SHIPLOOM_SCHEMAS="$GITHUB_WORKSPACE/schemas" shiploom init --green --harness auto
          SHIPLOOM_SCHEMAS="$GITHUB_WORKSPACE/schemas" shiploom validate --strict .
          SHIPLOOM_SCHEMAS="$GITHUB_WORKSPACE/schemas" shiploom status
          SHIPLOOM_SCHEMAS="$GITHUB_WORKSPACE/schemas" shiploom audit
      - name: AC demo (AC1-AC6; needs jq; node leg skips if unavailable)
        run: SHIPLOOM_GO_BIN=/tmp/shiploom-go sh scripts/ac-demo.sh
      - name: Harness conformance (deterministic, no LLM calls)
        run: SHIPLOOM_SCHEMAS="$PWD/schemas" /tmp/shiploom-go conformance --harness all

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Docs sync check + self-test + static build
        working-directory: site
        run: |
          node scripts/sync-docs.mjs --self-test
          node scripts/sync-docs.mjs --check
          npm ci --no-audit --no-fund
          npm run build
