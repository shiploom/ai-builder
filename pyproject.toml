[project]
name = "shiploom-core"
# PEP 440 package version. Spec version lives in core/VERSION (1.0.0-draft).
version = "1.0.0.dev0"
description = "Shiploom Core — portable, zero-runtime AI software engineering layer (Specifier/Implementer/Verifier + deterministic orchestrator)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shiploom" }]
keywords = ["ai", "sdlc", "verification", "agents", "skills", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
shiploom = "cli.shiploom:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "validators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
package = true
