apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.example.com/demo:1.0.0 # pin digests in prod
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          envFrom:
            - secretRef: {name: app-secrets} # Sealed-Secrets ref in prod
