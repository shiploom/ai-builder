name: validator

on:
  push:
    paths:
      - "validators/**"
      - "schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/**"
      - "site/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "scripts/build-go.sh"
      - ".github/workflows/validator.yml"
  pull_request:
    paths:
      - "validators/**"
      - "schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/**"
      - "site/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "scripts/build-go.sh"

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras for pytest only; validator itself is stdlib-only)
        run: pip install -e ".[dev]"
      - name: Hermetic unit tests (no network)
        run: pytest tests/unit -q
      - name: Strict validate on repo (offline, stdlib only)
        run: python validators/validate.py --strict .
      - name: Trace index builds with zero dangling links
        run: python validators/trace.py --strict . --out /tmp/trace.json
      - name: Installed entry point smoke (init/validate/status/doctor/audit)
        run: |
          shiploom doctor
          rm -rf /tmp/ship-smoke && mkdir -p /tmp/ship-smoke && cd /tmp/ship-smoke
          shiploom init --green --harness auto
          shiploom validate --strict .
          shiploom status
          shiploom audit
      - name: AC demo (AC1-AC6, ~90s; node leg skips if unavailable)
        run: SHIP_PY="$(command -v python)" sh scripts/ac-demo.sh
      - name: Harness conformance (deterministic, no LLM calls)
        run: shiploom conformance --harness all

  go-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Format, vet, unit test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./cmd/... ./internal/...
          go test ./cmd/... ./internal/...
      - name: Golden parity vs Python reference
        run: |
          sh scripts/build-go.sh /tmp/shiploom-go
          sh tests/parity/run.sh /tmp/shiploom-go

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Docs sync check + self-test + static build
        working-directory: site
        run: |
          node scripts/sync-docs.mjs --self-test
          node scripts/sync-docs.mjs --check
          npm ci --no-audit --no-fund
          npm run build
