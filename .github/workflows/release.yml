name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with dev extras
        run: pip install -e ".[dev]"
      - name: Tag matches core/VERSION and pyproject
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          tag = "${{ github.ref_name }}".lstrip("v")
          core = Path("core/VERSION").read_text().strip()
          pyproject = Path("pyproject.toml").read_text()
          pkg = re.search(r'^version = "([^"]+)"', pyproject, re.M).group(1)
          assert tag == core == pkg, (tag, core, pkg)
          print("version consistent:", tag)
          EOF
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Strict validate + trace
        run: |
          python validators/validate.py --strict .
          python validators/trace.py --strict . --out /tmp/trace.json
      - name: Entry point smoke
        run: |
          shiploom doctor
          rm -rf /tmp/ship-smoke && mkdir -p /tmp/ship-smoke && cd /tmp/ship-smoke
          shiploom init --green --harness auto
          shiploom validate --strict .
      - name: AC demo
        run: SHIP_PY="$(command -v python)" sh scripts/ac-demo.sh
      - name: Harness conformance
        run: shiploom conformance --harness all
      - name: Build distributions
        run: |
          pip install build cyclonedx-bom
          python -m build
          cyclonedx-py environment --output-format JSON --output-file dist/sbom.json
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" \
            --notes "See CHANGELOG.md for this release." dist/* || \
          gh release upload "${{ github.ref_name }}" dist/* --clobber
