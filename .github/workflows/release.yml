name: release

on:
  push:
    tags: ["v*"]

jobs:
  go-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      # Operator tooling only (auto-detected test gates shell out to the
      # ambient pytest, like node for the node leg); the CLI under test
      # is the Go binary.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pytest operator shim
        run: pip install pytest
      - name: gofmt clean
        run: test -z "$(gofmt -l internal/ cmd/)"
      - name: Go vet + tests
        run: |
          go vet ./...
          go test ./...
      - name: Stamped binary + AC demo
        run: |
          sh scripts/build-go.sh /tmp/shiploom-go
          SHIPLOOM_GO_BIN=/tmp/shiploom-go sh scripts/ac-demo.sh

  go-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - name: Version check
        run: test "${{ github.ref_name }}" = "v$(cat core/VERSION)"
      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(cat core/VERSION)"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X github.com/shiploom/ai-builder/internal/version.CoreVersion=$VERSION" \
            -o "dist/shiploom-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/shiploom
      - uses: actions/upload-artifact@v7
        with:
          name: shiploom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/shiploom-*

  release:
    needs: [go-verify, go-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      # Operator tooling only (auto-detected test gates shell out to the
      # ambient pytest, like node for the node leg); the CLI under test
      # is the Go binary.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pytest operator shim
        run: pip install pytest
      - name: Build CLI
        run: sh scripts/build-go.sh /tmp/shiploom-rel
      - name: Version parity (tag, core, npx, go stamp)
        run: sh scripts/version-check.sh /tmp/shiploom-rel "${{ github.ref_name }}"
      - name: Strict validate on repo (offline, stdlib only)
        run: SHIPLOOM_SCHEMAS="$PWD/schemas" /tmp/shiploom-rel validate --strict .
      - name: Entry point smoke
        run: |
          export PATH="/tmp:$PATH" && cp /tmp/shiploom-rel /tmp/shiploom
          SHIPLOOM_SCHEMAS="$PWD/schemas" shiploom doctor
          rm -rf /tmp/ship-smoke && mkdir -p /tmp/ship-smoke && cd /tmp/ship-smoke
          SHIPLOOM_SCHEMAS="$GITHUB_WORKSPACE/schemas" shiploom init --green --harness auto
          SHIPLOOM_SCHEMAS="$GITHUB_WORKSPACE/schemas" shiploom validate --strict .
      - name: AC demo
        run: SHIPLOOM_GO_BIN=/tmp/shiploom-rel sh scripts/ac-demo.sh
      - name: Harness conformance
        run: SHIPLOOM_SCHEMAS="$PWD/schemas" /tmp/shiploom-rel conformance --harness all
      - name: Build distributions
        run: |
          mkdir -p dist
          go list -m all > dist/go-modules.txt
          printf 'stdlib-only Go binary: no third-party modules (see go-modules.txt)\n' > dist/go-sbom-note.txt
      - name: Collect Go binaries
        uses: actions/download-artifact@v8
        with:
          pattern: shiploom-*
          path: dist/go-bin
          merge-multiple: true
      - name: Assert Go binaries present
        run: |
          ls -la dist/go-bin || { echo "download produced no dist/go-bin"; exit 2; }
          test -n "$(ls -A dist/go-bin)" || { echo "no Go binaries matched pattern shiploom-*"; exit 2; }
      - name: Package tool data
        run: |
          VERSION="$(cat core/VERSION)"
          rm -rf dist/data-stage && mkdir -p dist/data-stage/core
          cp -r schemas dist/data-stage/schemas
          cp core/VERSION dist/data-stage/core/VERSION
          for sub in workflows policies hooks skills roles; do
            cp -r "core/$sub" "dist/data-stage/core/$sub"
          done
          cp -r adapters dist/data-stage/adapters
          cp -r examples dist/data-stage/examples
          tar -czf "dist/shiploom-data-$VERSION.tar.gz" -C dist/data-stage schemas core
          rm -rf dist/data-stage
      - name: Checksums
        run: |
          (cd dist/go-bin && sha256sum shiploom-* > ../shiploom-checksums.txt)
          ls -la dist dist/go-bin
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/*.tar.gz dist/go-modules.txt dist/go-sbom-note.txt dist/shiploom-checksums.txt dist/go-bin/shiploom-*"
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" \
            --notes "See CHANGELOG.md for this release." $ASSETS || \
          gh release upload "${{ github.ref_name }}" $ASSETS --clobber

  npm-publish:
    # OIDC trusted publishing: no tokens, no 2FA prompts in CI. One-time
    # setup: publish @shiploom/cli once manually, register this repo +
    # workflow as a trusted publisher in the package settings on npmjs.com,
    # then set the NPM_TRUSTED_PUBLISHING repo variable to 'true'.
    # Skipped until then so untagged/unconfigured runs stay green.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Update npm (OIDC trusted publishing needs npm 11.5.1+)
        run: npm install -g npm@latest
      - name: Publish @shiploom/cli
        working-directory: wrappers/npx
        run: npm publish --provenance --access public
